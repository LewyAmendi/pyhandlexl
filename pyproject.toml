[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhandlexl"
version = "0.9.6"
description = "An organised, labelled-table API for reading and writing data in Excel .xlsx files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lewis Wainaina", email = "lewyamendi@gmail.com" }]
keywords = ["excel", "xlsx", "openpyxl", "spreadsheet", "xl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["openpyxl>=3.1.3,<4"]

[project.optional-dependencies]
# openpyxl uses lxml, when it is installed, to write files faster
fast = ["lxml"]
# Table.to_dataframe / from_dataframe and grid.to_dataframe / from_dataframe
pandas = ["pandas>=2.0"]
# Table.to_numpy
numpy = ["numpy>=1.23"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-openpyxl", "pandas>=2.0", "numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/LewyAmendi/pyhandlexl"
Repository = "https://github.com/LewyAmendi/pyhandlexl"
Issues = "https://github.com/LewyAmendi/pyhandlexl/issues"
Changelog = "https://github.com/LewyAmendi/pyhandlexl/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyhandlexl = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Leave Markdown to the author — keep README example formatting hand-aligned.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# a table of signatures, one per line: wrapping would make it unreadable
"tests/test_public_api.py" = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"